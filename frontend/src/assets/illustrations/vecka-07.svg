<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t7 d7" font-family="'Source Sans 3', 'Source Sans', system-ui, -apple-system, 'Segoe UI', sans-serif"><title id="t7">Ångestkurvan</title><desc id="d7">Ångesten stiger och sjunker av sig själv om du stannar kvar. Går du därifrån får den inte sjunka.</desc><defs><marker id="mS7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#4F6A5A"/></marker><marker id="mT7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#C57A5F"/></marker><marker id="mM7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#7A7468"/></marker></defs><rect x="1" y="1" width="638" height="318" rx="18" fill="#FFFFFF" stroke="#EAE3D7" stroke-width="2"/><line x1="60" y1="270" x2="60" y2="40" stroke="#7A7468" stroke-width="2" stroke-linecap="round" marker-end="url(#mM7)"/><line x1="60" y1="270" x2="610" y2="270" stroke="#7A7468" stroke-width="2" stroke-linecap="round" marker-end="url(#mM7)"/><text transform="rotate(-90 40 156)" x="40" y="156" font-size="13" font-weight="600" fill="#7A7468" text-anchor="middle">Ångest</text><text x="610" y="292" font-size="13" font-weight="600" fill="#7A7468" text-anchor="end">Tid i situationen</text><path d="M60,262 C130,120 190,82 260,84 C360,86 430,200 590,246" fill="none" stroke="#4F6A5A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M60,262 C100,170 150,114 192,104 L206,262" fill="none" stroke="#C57A5F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 0"/><circle cx="206" cy="262" r="5" fill="#C57A5F"/><text x="214" y="248" font-size="13" font-weight="600" fill="#A65F45" text-anchor="start">Du går därifrån</text><line x1="80" y1="26" x2="112" y2="26" stroke="#4F6A5A" stroke-width="4" stroke-linecap="round"/><text x="120" y="31" font-size="14" font-weight="600" fill="#4F6A5A" text-anchor="start">Du stannar kvar: ångesten sjunker av sig själv</text><line x1="80" y1="50" x2="112" y2="50" stroke="#C57A5F" stroke-width="4" stroke-linecap="round"/><text x="120" y="55" font-size="14" font-weight="600" fill="#A65F45" text-anchor="start">Du går: lättnad nu, men ångesten fick inte sjunka</text></svg>