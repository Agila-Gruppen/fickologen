<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t2 d2" font-family="'Source Sans 3', 'Source Sans', system-ui, -apple-system, 'Segoe UI', sans-serif"><title id="t2">Tanke, känsla och kropp</title><desc id="d2">En händelse sätter igång en tanke, en känsla och en kroppsreaktion som påverkar varandra.</desc><defs><marker id="mS2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#4F6A5A"/></marker><marker id="mT2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#C57A5F"/></marker><marker id="mM2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#7A7468"/></marker></defs><rect x="1" y="1" width="638" height="318" rx="18" fill="#FFFFFF" stroke="#EAE3D7" stroke-width="2"/><rect x="20.0" y="118" width="150" height="84" rx="14" fill="#FFFFFF" stroke="#EAE3D7" stroke-width="1.5"/><text x="95" y="142" font-size="15" font-weight="600" fill="#33312D" text-anchor="middle">Händelse</text><text x="95" y="164" font-size="13.5" font-weight="400" fill="#7A7468" text-anchor="middle">Det blir tyst</text><text x="95" y="182" font-size="13.5" font-weight="400" fill="#7A7468" text-anchor="middle">i fikarummet</text><rect x="325.0" y="14" width="190" height="64" rx="14" fill="#FBEDE0" stroke="#E8B792" stroke-width="1.5"/><text x="420" y="38" font-size="15" font-weight="600" fill="#33312D" text-anchor="middle">Tanke</text><text x="420" y="60" font-size="13.5" font-weight="400" fill="#7A7468" text-anchor="middle">'De pratade om mig'</text><rect x="200.0" y="240" width="170" height="64" rx="14" fill="#E7EFE8" stroke="#7C9885" stroke-width="1.5"/><text x="285" y="264" font-size="15" font-weight="600" fill="#33312D" text-anchor="middle">Känsla</text><text x="285" y="286" font-size="13.5" font-weight="400" fill="#7A7468" text-anchor="middle">Skam och oro</text><rect x="465.0" y="240" width="170" height="64" rx="14" fill="#F6E6DF" stroke="#C57A5F" stroke-width="1.5"/><text x="550" y="264" font-size="15" font-weight="600" fill="#33312D" text-anchor="middle">Kropp</text><text x="550" y="286" font-size="13.5" font-weight="400" fill="#7A7468" text-anchor="middle">Hjärtat slår fort</text><line x1="170" y1="140" x2="325" y2="62" stroke="#7A7468" stroke-width="2" stroke-linecap="round" marker-end="url(#mM2)"/><line x1="385" y1="80" x2="310" y2="238" stroke="#4F6A5A" stroke-width="2.5" stroke-linecap="round" marker-end="url(#mS2)" marker-start="url(#mS2)"/><line x1="455" y1="80" x2="525" y2="238" stroke="#C57A5F" stroke-width="2.5" stroke-linecap="round" marker-end="url(#mT2)" marker-start="url(#mT2)"/><line x1="372" y1="272" x2="463" y2="272" stroke="#7A7468" stroke-width="2.5" stroke-linecap="round" marker-end="url(#mM2)" marker-start="url(#mM2)"/><text x="420" y="160" font-size="14" font-weight="400" fill="#7A7468" text-anchor="middle" font-style="italic">Allt hänger ihop</text><text x="420" y="179" font-size="14" font-weight="400" fill="#7A7468" text-anchor="middle" font-style="italic">och påverkar varandra</text></svg>