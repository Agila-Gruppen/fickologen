<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t11 d11" font-family="'Source Sans 3', 'Source Sans', system-ui, -apple-system, 'Segoe UI', sans-serif"><title id="t11">Enkla samtalsverktyg</title><desc id="d11">Ett samtal med en öppen fråga, aktivt lyssnande och en följdfråga.</desc><defs><marker id="mS11" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#4F6A5A"/></marker><marker id="mT11" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#C57A5F"/></marker><marker id="mM11" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#7A7468"/></marker></defs><rect x="1" y="1" width="638" height="318" rx="18" fill="#FFFFFF" stroke="#EAE3D7" stroke-width="2"/><rect x="24" y="26" width="220" height="52" rx="16" fill="#E7EFE8" stroke="#7C9885" stroke-width="1.5"/><polygon points="46,77 56,90 68,77" fill="#E7EFE8" stroke="#7C9885" stroke-width="1.5"/><rect x="47" y="75" width="20" height="4" fill="#E7EFE8"/><text x="134.0" y="54" font-size="15" font-weight="400" fill="#33312D" text-anchor="middle">Hur var din helg?</text><circle cx="262" cy="52" r="13" fill="#4F6A5A"/><text x="262" y="57" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><rect x="170" y="112" width="230" height="52" rx="16" fill="#FFFFFF" stroke="#EAE3D7" stroke-width="1.5"/><polygon points="378,163 368,176 356,163" fill="#FFFFFF" stroke="#EAE3D7" stroke-width="1.5"/><rect x="357" y="161" width="20" height="4" fill="#FFFFFF"/><text x="285.0" y="140" font-size="15" font-weight="400" fill="#33312D" text-anchor="middle">Jag var på en vandring.</text><circle cx="418" cy="138" r="13" fill="#4F6A5A"/><text x="418" y="143" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><rect x="24" y="200" width="200" height="52" rx="16" fill="#E7EFE8" stroke="#7C9885" stroke-width="1.5"/><polygon points="46,251 56,264 68,251" fill="#E7EFE8" stroke="#7C9885" stroke-width="1.5"/><rect x="47" y="249" width="20" height="4" fill="#E7EFE8"/><text x="124.0" y="228" font-size="15" font-weight="400" fill="#33312D" text-anchor="middle">Vart gick ni?</text><circle cx="242" cy="226" r="13" fill="#4F6A5A"/><text x="242" y="231" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><rect x="444" y="20" width="180" height="282" rx="14" fill="#F4EFE6" stroke="#EAE3D7" stroke-width="1.5"/><text x="534" y="48" font-size="14.5" font-weight="600" fill="#33312D" text-anchor="middle">Tre enkla verktyg</text><circle cx="468" cy="86" r="13" fill="#4F6A5A"/><text x="468" y="91" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="488" y="91" font-size="14" font-weight="600" fill="#33312D" text-anchor="start">Öppen fråga</text><text x="488" y="112" font-size="12.5" font-weight="400" fill="#7A7468" text-anchor="start">som inte går att</text><text x="488" y="128" font-size="12.5" font-weight="400" fill="#7A7468" text-anchor="start">svara ja eller nej på</text><circle cx="468" cy="162" r="13" fill="#4F6A5A"/><text x="468" y="167" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="488" y="167" font-size="14" font-weight="600" fill="#33312D" text-anchor="start">Lyssna aktivt</text><text x="488" y="188" font-size="12.5" font-weight="400" fill="#7A7468" text-anchor="start">nicka och titta</text><text x="488" y="204" font-size="12.5" font-weight="400" fill="#7A7468" text-anchor="start">på personen</text><circle cx="468" cy="238" r="13" fill="#4F6A5A"/><text x="468" y="243" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="488" y="243" font-size="14" font-weight="600" fill="#33312D" text-anchor="start">Följdfråga</text><text x="488" y="264" font-size="12.5" font-weight="400" fill="#7A7468" text-anchor="start">visa att du är</text><text x="488" y="280" font-size="12.5" font-weight="400" fill="#7A7468" text-anchor="start">nyfiken</text></svg>