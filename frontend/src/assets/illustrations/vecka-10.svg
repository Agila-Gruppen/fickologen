<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t10 d10" font-family="'Source Sans 3', 'Source Sans', system-ui, -apple-system, 'Segoe UI', sans-serif"><title id="t10">Med och utan skydd</title><desc id="d10">En person med krycka och en utan: skydd känns tryggt men hindrar dig från att lära dig att det går bra utan.</desc><defs><marker id="mS10" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#4F6A5A"/></marker><marker id="mT10" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#C57A5F"/></marker><marker id="mM10" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#7A7468"/></marker></defs><rect x="1" y="1" width="638" height="318" rx="18" fill="#FFFFFF" stroke="#EAE3D7" stroke-width="2"/><rect x="16" y="16" width="296" height="288" rx="14" fill="#FFFFFF" stroke="#EAE3D7" stroke-width="1.5"/><rect x="328" y="16" width="296" height="288" rx="14" fill="#FFFFFF" stroke="#EAE3D7" stroke-width="1.5"/><text x="164" y="46" font-size="17" font-weight="600" fill="#A65F45" text-anchor="middle">Med skydd</text><circle cx="96" cy="92" r="14" fill="#FFFFFF" stroke="#4F6A5A" stroke-width="4"/><line x1="96" y1="106" x2="96" y2="168" stroke="#4F6A5A" stroke-width="4" stroke-linecap="round"/><line x1="96" y1="168" x2="78" y2="216" stroke="#4F6A5A" stroke-width="4" stroke-linecap="round"/><line x1="96" y1="168" x2="114" y2="216" stroke="#4F6A5A" stroke-width="4" stroke-linecap="round"/><line x1="96" y1="124" x2="68" y2="154" stroke="#4F6A5A" stroke-width="4" stroke-linecap="round"/><line x1="96" y1="124" x2="124" y2="146" stroke="#4F6A5A" stroke-width="4" stroke-linecap="round"/><line x1="114" y1="142" x2="136" y2="142" stroke="#C57A5F" stroke-width="4" stroke-linecap="round"/><line x1="126" y1="142" x2="140" y2="218" stroke="#C57A5F" stroke-width="4" stroke-linecap="round"/><rect x="176" y="92" width="124" height="26" rx="13" fill="#F6E6DF" stroke="#C57A5F" stroke-width="1.5"/><text x="238.0" y="110" font-size="12.5" font-weight="500" fill="#33312D" text-anchor="middle">repeterar meningar</text><rect x="176" y="126" width="124" height="26" rx="13" fill="#F6E6DF" stroke="#C57A5F" stroke-width="1.5"/><text x="238.0" y="144" font-size="12.5" font-weight="500" fill="#33312D" text-anchor="middle">tittar ner</text><rect x="176" y="160" width="124" height="26" rx="13" fill="#F6E6DF" stroke="#C57A5F" stroke-width="1.5"/><text x="238.0" y="178" font-size="12.5" font-weight="500" fill="#33312D" text-anchor="middle">håller i telefonen</text><text x="164" y="262" font-size="13.5" font-weight="400" fill="#7A7468" text-anchor="middle">Det känns tryggt, men du får</text><text x="164" y="281" font-size="13.5" font-weight="400" fill="#7A7468" text-anchor="middle">aldrig veta om du klarar dig utan</text><text x="476" y="46" font-size="17" font-weight="600" fill="#4F6A5A" text-anchor="middle">Utan skydd</text><circle cx="410" cy="92" r="14" fill="#FFFFFF" stroke="#4F6A5A" stroke-width="4"/><line x1="410" y1="106" x2="410" y2="168" stroke="#4F6A5A" stroke-width="4" stroke-linecap="round"/><line x1="410" y1="168" x2="392" y2="216" stroke="#4F6A5A" stroke-width="4" stroke-linecap="round"/><line x1="410" y1="168" x2="428" y2="216" stroke="#4F6A5A" stroke-width="4" stroke-linecap="round"/><line x1="410" y1="124" x2="382" y2="154" stroke="#4F6A5A" stroke-width="4" stroke-linecap="round"/><line x1="410" y1="124" x2="440" y2="150" stroke="#4F6A5A" stroke-width="4" stroke-linecap="round"/><rect x="490" y="100" width="122" height="26" rx="13" fill="#E7EFE8" stroke="#7C9885" stroke-width="1.5"/><text x="551.0" y="118" font-size="12.5" font-weight="500" fill="#33312D" text-anchor="middle">Telefonen i väskan</text><rect x="490" y="140" width="122" height="26" rx="13" fill="#E7EFE8" stroke="#7C9885" stroke-width="1.5"/><text x="551.0" y="158" font-size="12.5" font-weight="500" fill="#33312D" text-anchor="middle">Ögonen uppåt</text><text x="476" y="262" font-size="13.5" font-weight="400" fill="#7A7468" text-anchor="middle">Du får se vad som faktiskt</text><text x="476" y="281" font-size="13.5" font-weight="400" fill="#7A7468" text-anchor="middle">händer, och det går oftast bra</text></svg>