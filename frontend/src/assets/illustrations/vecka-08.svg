<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t8 d8" font-family="'Source Sans 3', 'Source Sans', system-ui, -apple-system, 'Segoe UI', sans-serif"><title id="t8">Upprepa tills det blir lättare</title><desc id="d8">Ångesten sjunker över fem övningar, med en tillfälligt sämre dag.</desc><defs><marker id="mS8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#4F6A5A"/></marker><marker id="mT8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#C57A5F"/></marker><marker id="mM8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#7A7468"/></marker></defs><rect x="1" y="1" width="638" height="318" rx="18" fill="#FFFFFF" stroke="#EAE3D7" stroke-width="2"/><text x="320" y="32" font-size="16" font-weight="600" fill="#33312D" text-anchor="middle">Högsta ångest i samma övning, gång efter gång</text><line x1="60" y1="262" x2="600" y2="262" stroke="#7A7468" stroke-width="2" stroke-linecap="round"/><rect x="80" y="82" width="70" height="180" rx="8" fill="#7C9885" stroke="#7C9885" stroke-width="1"/><text x="115" y="74" font-size="16" font-weight="700" fill="#33312D" text-anchor="middle">60</text><text x="115" y="284" font-size="13.5" font-weight="400" fill="#7A7468" text-anchor="middle">Gång 1</text><rect x="180" y="112" width="70" height="150" rx="8" fill="#7C9885" stroke="#7C9885" stroke-width="1"/><text x="215" y="104" font-size="16" font-weight="700" fill="#33312D" text-anchor="middle">50</text><text x="215" y="284" font-size="13.5" font-weight="400" fill="#7A7468" text-anchor="middle">Gång 2</text><rect x="280" y="142" width="70" height="120" rx="8" fill="#7C9885" stroke="#7C9885" stroke-width="1"/><text x="315" y="134" font-size="16" font-weight="700" fill="#33312D" text-anchor="middle">40</text><text x="315" y="284" font-size="13.5" font-weight="400" fill="#7A7468" text-anchor="middle">Gång 3</text><rect x="380" y="127" width="70" height="135" rx="8" fill="#C57A5F" stroke="#C57A5F" stroke-width="1"/><text x="415" y="119" font-size="16" font-weight="700" fill="#33312D" text-anchor="middle">45</text><text x="415" y="284" font-size="13.5" font-weight="400" fill="#7A7468" text-anchor="middle">Gång 4</text><rect x="480" y="187" width="70" height="75" rx="8" fill="#7C9885" stroke="#7C9885" stroke-width="1"/><text x="515" y="179" font-size="16" font-weight="700" fill="#33312D" text-anchor="middle">25</text><text x="515" y="284" font-size="13.5" font-weight="400" fill="#7A7468" text-anchor="middle">Gång 5</text><text x="415" y="66" font-size="13.5" font-weight="600" fill="#A65F45" text-anchor="middle">En tråkig dag hör till</text><line x1="415" y1="74" x2="415" y2="98" stroke="#A65F45" stroke-width="2" stroke-linecap="round" marker-end="url(#mT8)"/><text x="320" y="306" font-size="13" font-weight="400" fill="#7A7468" text-anchor="middle" font-style="italic">Det blir oftast lättare med upprepning, inte efter en enda gång.</text></svg>