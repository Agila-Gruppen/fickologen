<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t1 d1" font-family="'Source Sans 3', 'Source Sans', system-ui, -apple-system, 'Segoe UI', sans-serif"><title id="t1">Cirkeln som håller ångesten vid liv</title><desc id="d1">Situation, tanke, kropp och skydd leder till nästa runda.</desc><defs><marker id="mS1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#4F6A5A"/></marker><marker id="mT1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#C57A5F"/></marker><marker id="mM1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#7A7468"/></marker></defs><rect x="1" y="1" width="638" height="318" rx="18" fill="#FFFFFF" stroke="#EAE3D7" stroke-width="2"/><rect x="235.0" y="12" width="170" height="70" rx="14" fill="#FFFFFF" stroke="#EAE3D7" stroke-width="1.5"/><text x="320" y="36" font-size="15" font-weight="600" fill="#33312D" text-anchor="middle">Situation</text><text x="320" y="58" font-size="13.5" font-weight="400" fill="#7A7468" text-anchor="middle">Ett möte,</text><text x="320" y="76" font-size="13.5" font-weight="400" fill="#7A7468" text-anchor="middle">en middag</text><rect x="430.0" y="125" width="170" height="70" rx="14" fill="#FBEDE0" stroke="#E8B792" stroke-width="1.5"/><text x="515" y="149" font-size="15" font-weight="600" fill="#33312D" text-anchor="middle">Tanke</text><text x="515" y="171" font-size="13.5" font-weight="400" fill="#7A7468" text-anchor="middle">'De ser att jag</text><text x="515" y="189" font-size="13.5" font-weight="400" fill="#7A7468" text-anchor="middle">är nervös'</text><rect x="235.0" y="238" width="170" height="70" rx="14" fill="#F6E6DF" stroke="#C57A5F" stroke-width="1.5"/><text x="320" y="262" font-size="15" font-weight="600" fill="#33312D" text-anchor="middle">Kropp</text><text x="320" y="284" font-size="13.5" font-weight="400" fill="#7A7468" text-anchor="middle">Hjärtklappning,</text><text x="320" y="302" font-size="13.5" font-weight="400" fill="#7A7468" text-anchor="middle">rodnad</text><rect x="40.0" y="125" width="170" height="70" rx="14" fill="#E7EFE8" stroke="#7C9885" stroke-width="1.5"/><text x="125" y="149" font-size="15" font-weight="600" fill="#33312D" text-anchor="middle">Skydd</text><text x="125" y="171" font-size="13.5" font-weight="400" fill="#7A7468" text-anchor="middle">Undviker, ser ner,</text><text x="125" y="189" font-size="13.5" font-weight="400" fill="#7A7468" text-anchor="middle">går därifrån</text><path d="M410,47 Q515,47 515,121" fill="none" stroke="#C57A5F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mT1)"/><path d="M515,199 Q515,273 410,273" fill="none" stroke="#C57A5F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mT1)"/><path d="M230,273 Q125,273 125,199" fill="none" stroke="#C57A5F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mT1)"/><path d="M125,121 Q125,47 230,47" fill="none" stroke="#C57A5F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mT1)"/><text x="320" y="152" font-size="18" font-weight="600" fill="#A65F45" text-anchor="middle">Ångesten</text><text x="320" y="175" font-size="18" font-weight="600" fill="#A65F45" text-anchor="middle">hålls vid liv</text></svg>