# Streamlit reads .streamlit/config.toml from the folder it is started in.
# This copy is used when the app is started from the repo root
# (`streamlit run frontend/src/app.py`, as the dev container does);
# frontend/.streamlit/config.toml when started from frontend/.
# Keep the two identical. base = "light" keeps the app light even when
# the browser or OS is in dark mode.

[theme]
base = "light"
primaryColor = "#7C9885"
backgroundColor = "#FAF7F1"
secondaryBackgroundColor = "#F1EAE0"
textColor = "#3A3733"
font = "sans serif"

[server]
headless = true
runOnSave = true

[browser]
gatherUsageStats = false
