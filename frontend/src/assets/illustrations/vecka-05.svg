<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t5 d5" font-family="'Source Sans 3', 'Source Sans', system-ui, -apple-system, 'Segoe UI', sans-serif"><title id="t5">Så testar du en farhåga</title><desc id="d5">Fyra steg: farhåga, plan, testa och jämför med din gissning.</desc><defs><marker id="mS5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#4F6A5A"/></marker><marker id="mT5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#C57A5F"/></marker><marker id="mM5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#7A7468"/></marker></defs><rect x="1" y="1" width="638" height="318" rx="18" fill="#FFFFFF" stroke="#EAE3D7" stroke-width="2"/><text x="320" y="36" font-size="17" font-weight="600" fill="#33312D" text-anchor="middle">Så testar du en farhåga</text><rect x="11" y="62" width="138" height="150" rx="14" fill="#FBEDE0" stroke="#E8B792" stroke-width="1.5"/><circle cx="80" cy="86" r="14" fill="#4F6A5A"/><text x="80" y="91" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="80" y="126" font-size="16" font-weight="600" fill="#33312D" text-anchor="middle">Farhåga</text><text x="80" y="150" font-size="13" font-weight="400" fill="#7A7468" text-anchor="middle">'Personen tycker</text><text x="80" y="168" font-size="13" font-weight="400" fill="#7A7468" text-anchor="middle">att jag är konstig'</text><line x1="153" y1="137" x2="168" y2="137" stroke="#4F6A5A" stroke-width="2.5" stroke-linecap="round" marker-end="url(#mS5)"/><rect x="171" y="62" width="138" height="150" rx="14" fill="#FFFFFF" stroke="#EAE3D7" stroke-width="1.5"/><circle cx="240" cy="86" r="14" fill="#4F6A5A"/><text x="240" y="91" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="240" y="126" font-size="16" font-weight="600" fill="#33312D" text-anchor="middle">Plan</text><text x="240" y="150" font-size="13" font-weight="400" fill="#7A7468" text-anchor="middle">Fråga om vägen</text><text x="240" y="168" font-size="13" font-weight="400" fill="#7A7468" text-anchor="middle">på torsdag</text><line x1="313" y1="137" x2="328" y2="137" stroke="#4F6A5A" stroke-width="2.5" stroke-linecap="round" marker-end="url(#mS5)"/><rect x="331" y="62" width="138" height="150" rx="14" fill="#E7EFE8" stroke="#7C9885" stroke-width="1.5"/><circle cx="400" cy="86" r="14" fill="#4F6A5A"/><text x="400" y="91" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="400" y="126" font-size="16" font-weight="600" fill="#33312D" text-anchor="middle">Testa</text><text x="400" y="150" font-size="13" font-weight="400" fill="#7A7468" text-anchor="middle">Gör det och skriv</text><text x="400" y="168" font-size="13" font-weight="400" fill="#7A7468" text-anchor="middle">direkt efteråt vad</text><text x="400" y="186" font-size="13" font-weight="400" fill="#7A7468" text-anchor="middle">som hände</text><line x1="473" y1="137" x2="488" y2="137" stroke="#4F6A5A" stroke-width="2.5" stroke-linecap="round" marker-end="url(#mS5)"/><rect x="491" y="62" width="138" height="150" rx="14" fill="#E7EFE8" stroke="#7C9885" stroke-width="1.5"/><circle cx="560" cy="86" r="14" fill="#4F6A5A"/><text x="560" y="91" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="560" y="126" font-size="16" font-weight="600" fill="#33312D" text-anchor="middle">Jämför</text><text x="560" y="150" font-size="13" font-weight="400" fill="#7A7468" text-anchor="middle">Jag trodde: 70</text><text x="560" y="168" font-size="13" font-weight="400" fill="#7A7468" text-anchor="middle">Det blev: 20</text><text x="560" y="186" font-size="13" font-weight="400" fill="#7A7468" text-anchor="middle">Vad lärde jag mig?</text><text x="320" y="252" font-size="15" font-weight="400" fill="#7A7468" text-anchor="middle" font-style="italic">Du samlar fakta. Det handlar inte om att lyckas.</text></svg>