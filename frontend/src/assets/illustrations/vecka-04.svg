<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t4 d4" font-family="'Source Sans 3', 'Source Sans', system-ui, -apple-system, 'Segoe UI', sans-serif"><title id="t4">Pröva tanken</title><desc id="d4">Vad som talar för och emot en tanke, och hur tron på tanken sjunker från 80 till 50.</desc><defs><marker id="mS4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#4F6A5A"/></marker><marker id="mT4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#C57A5F"/></marker><marker id="mM4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#7A7468"/></marker></defs><rect x="1" y="1" width="638" height="318" rx="18" fill="#FFFFFF" stroke="#EAE3D7" stroke-width="2"/><rect x="16" y="14" width="608" height="44" rx="14" fill="#FBEDE0" stroke="#E8B792" stroke-width="1.5"/><text x="320" y="42" font-size="15.5" font-weight="600" fill="#33312D" text-anchor="middle">Tanke: 'Alla tycker att jag är dum om jag säger fel'</text><rect x="16" y="70" width="296" height="124" rx="14" fill="#F6E6DF" stroke="#C57A5F" stroke-width="1.5"/><text x="164" y="98" font-size="15" font-weight="600" fill="#A65F45" text-anchor="middle">Talar för tanken</text><text x="164" y="126" font-size="14" font-weight="400" fill="#33312D" text-anchor="middle">Jag har blivit rättad förut</text><text x="164" y="150" font-size="14" font-weight="400" fill="#33312D" text-anchor="middle">Det kändes pinsamt</text><rect x="328" y="70" width="296" height="124" rx="14" fill="#E7EFE8" stroke="#7C9885" stroke-width="1.5"/><text x="476" y="98" font-size="15" font-weight="600" fill="#4F6A5A" text-anchor="middle">Talar emot tanken</text><text x="476" y="126" font-size="14" font-weight="400" fill="#33312D" text-anchor="middle">De flesta märker inte små fel</text><text x="476" y="150" font-size="14" font-weight="400" fill="#33312D" text-anchor="middle">Jag dömer inte en vän som säger fel</text><text x="16" y="222" font-size="14" font-weight="600" fill="#7A7468" text-anchor="start">Hur mycket tror jag på tanken? (0–100)</text><text x="16" y="249" font-size="14" font-weight="600" fill="#33312D" text-anchor="start">Före</text><rect x="70" y="232" width="480" height="24" rx="8" fill="#F4EFE6" stroke="#EAE3D7" stroke-width="1"/><rect x="70" y="232" width="384.0" height="24" rx="8" fill="#C57A5F" stroke="#C57A5F" stroke-width="1"/><text x="566" y="250" font-size="16" font-weight="700" fill="#33312D" text-anchor="start">80</text><text x="16" y="279" font-size="14" font-weight="600" fill="#33312D" text-anchor="start">Efter</text><rect x="70" y="262" width="480" height="24" rx="8" fill="#F4EFE6" stroke="#EAE3D7" stroke-width="1"/><rect x="70" y="262" width="240.0" height="24" rx="8" fill="#7C9885" stroke="#7C9885" stroke-width="1"/><text x="566" y="280" font-size="16" font-weight="700" fill="#33312D" text-anchor="start">50</text></svg>