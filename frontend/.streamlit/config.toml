# Keep identical to .streamlit/config.toml in the repo root, which is used
# when the app is started from there. base = "light" keeps the app light
# even when the browser or OS is in dark mode.

[theme]
base = "light"
primaryColor = "#7C9885"
backgroundColor = "#FAF7F1"
secondaryBackgroundColor = "#F1EAE0"
textColor = "#3A3733"
font = "sans serif"

[server]
headless = true
runOnSave = true

[browser]
gatherUsageStats = false
