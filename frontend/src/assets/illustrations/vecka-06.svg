<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t6 d6" font-family="'Source Sans 3', 'Source Sans', system-ui, -apple-system, 'Segoe UI', sans-serif"><title id="t6">Din stege</title><desc id="d6">Fem situationer från lätt till svårt, med ångestpoäng från 20 till 90.</desc><defs><marker id="mS6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#4F6A5A"/></marker><marker id="mT6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#C57A5F"/></marker><marker id="mM6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#7A7468"/></marker></defs><rect x="1" y="1" width="638" height="318" rx="18" fill="#FFFFFF" stroke="#EAE3D7" stroke-width="2"/><text x="24" y="34" font-size="17" font-weight="600" fill="#33312D" text-anchor="start">Din stege: från lätt till svårt</text><rect x="30" y="200" width="112" height="44" rx="10" fill="#E7EFE8" stroke="#7C9885" stroke-width="1.5"/><text x="86" y="230" font-size="20" font-weight="700" fill="#33312D" text-anchor="middle">20</text><text x="86" y="266" font-size="13.5" font-weight="400" fill="#33312D" text-anchor="middle">Fråga om</text><text x="86" y="283" font-size="13.5" font-weight="400" fill="#33312D" text-anchor="middle">vägen</text><rect x="148" y="170" width="112" height="74" rx="10" fill="#E7EFE8" stroke="#7C9885" stroke-width="1.5"/><text x="204" y="200" font-size="20" font-weight="700" fill="#33312D" text-anchor="middle">35</text><text x="204" y="266" font-size="13.5" font-weight="400" fill="#33312D" text-anchor="middle">Be om hjälp</text><text x="204" y="283" font-size="13.5" font-weight="400" fill="#33312D" text-anchor="middle">i en affär</text><rect x="266" y="140" width="112" height="104" rx="10" fill="#FBEDE0" stroke="#E8B792" stroke-width="1.5"/><text x="322" y="170" font-size="20" font-weight="700" fill="#33312D" text-anchor="middle">50</text><text x="322" y="266" font-size="13.5" font-weight="400" fill="#33312D" text-anchor="middle">Småprata med</text><text x="322" y="283" font-size="13.5" font-weight="400" fill="#33312D" text-anchor="middle">en granne</text><rect x="384" y="110" width="112" height="134" rx="10" fill="#FBEDE0" stroke="#E8B792" stroke-width="1.5"/><text x="440" y="140" font-size="20" font-weight="700" fill="#33312D" text-anchor="middle">60</text><text x="440" y="266" font-size="13.5" font-weight="400" fill="#33312D" text-anchor="middle">Säga något</text><text x="440" y="283" font-size="13.5" font-weight="400" fill="#33312D" text-anchor="middle">på ett möte</text><rect x="502" y="80" width="112" height="164" rx="10" fill="#F6E6DF" stroke="#C57A5F" stroke-width="1.5"/><text x="558" y="110" font-size="20" font-weight="700" fill="#33312D" text-anchor="middle">90</text><text x="558" y="266" font-size="13.5" font-weight="400" fill="#33312D" text-anchor="middle">Hålla ett</text><text x="558" y="283" font-size="13.5" font-weight="400" fill="#33312D" text-anchor="middle">kort tal</text><text x="86" y="168" font-size="13" font-weight="600" fill="#4F6A5A" text-anchor="middle">Börja här</text><line x1="86" y1="176" x2="86" y2="194" stroke="#4F6A5A" stroke-width="2.5" stroke-linecap="round" marker-end="url(#mS6)"/><text x="586" y="74" font-size="13" font-weight="600" fill="#A65F45" text-anchor="middle">Svårast</text><text x="320" y="308" font-size="12.5" font-weight="400" fill="#7A7468" text-anchor="middle" font-style="italic">Siffran är hur mycket ångest du tror att steget ger (0–100).</text></svg>