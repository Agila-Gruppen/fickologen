<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t12 d12" font-family="'Source Sans 3', 'Source Sans', system-ui, -apple-system, 'Segoe UI', sans-serif"><title id="t12">Bakslag är en del av vägen</title><desc id="d12">Framsteg går upp och ner. Ett bakslag är en tillfällig svacka, återfall vore att vara tillbaka på ruta ett.</desc><defs><marker id="mS12" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#4F6A5A"/></marker><marker id="mT12" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#C57A5F"/></marker><marker id="mM12" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#7A7468"/></marker></defs><rect x="1" y="1" width="638" height="318" rx="18" fill="#FFFFFF" stroke="#EAE3D7" stroke-width="2"/><line x1="60" y1="270" x2="60" y2="36" stroke="#7A7468" stroke-width="2" stroke-linecap="round" marker-end="url(#mM12)"/><line x1="60" y1="270" x2="612" y2="270" stroke="#7A7468" stroke-width="2" stroke-linecap="round" marker-end="url(#mM12)"/><text transform="rotate(-90 40 150)" x="40" y="150" font-size="13" font-weight="600" fill="#7A7468" text-anchor="middle">Hur det går</text><text x="612" y="292" font-size="13" font-weight="600" fill="#7A7468" text-anchor="end">Tid</text><line x1="60" y1="236" x2="600" y2="236" stroke="#C57A5F" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><text x="598" y="256" font-size="12.5" font-weight="600" fill="#A65F45" text-anchor="end">Ruta ett: där du började</text><path d="M70,226 L130,196 L190,210 L250,158 L310,172 L370,112 L430,150 L490,94 L550,70 L600,52" fill="none" stroke="#4F6A5A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="430" cy="150" r="7" fill="#C57A5F" stroke="#FFFFFF" stroke-width="2"/><text x="430" y="184" font-size="13.5" font-weight="600" fill="#A65F45" text-anchor="middle">Bakslag: en tillfällig svacka</text><text x="430" y="202" font-size="13" font-weight="400" fill="#7A7468" text-anchor="middle">Du fortsätter med din plan</text><text x="80" y="30" font-size="15" font-weight="600" fill="#33312D" text-anchor="start">Framsteg går sällan rakt uppåt</text></svg>