<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t3 d3" font-family="'Source Sans 3', 'Source Sans', system-ui, -apple-system, 'Segoe UI', sans-serif"><title id="t3">Sex vanliga tankefällor</title><desc id="d3">Tankeläsning, katastroftänkande, allt eller inget, mentalt filter, känslotänkande och måste/borde med exempel.</desc><defs><marker id="mS3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#4F6A5A"/></marker><marker id="mT3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#C57A5F"/></marker><marker id="mM3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#7A7468"/></marker></defs><rect x="1" y="1" width="638" height="318" rx="18" fill="#FFFFFF" stroke="#EAE3D7" stroke-width="2"/><rect x="16" y="18" width="196" height="130" rx="14" fill="#E7EFE8" stroke="#7C9885" stroke-width="1.5"/><text x="114" y="54" font-size="16" font-weight="600" fill="#33312D" text-anchor="middle">Tankeläsning</text><line x1="54" y1="68" x2="174" y2="68" stroke="#7C9885" stroke-width="2" stroke-linecap="round"/><text x="114" y="96" font-size="13.5" font-weight="400" fill="#33312D" text-anchor="middle" font-style="italic">'Hon tycker att</text><text x="114" y="116" font-size="13.5" font-weight="400" fill="#33312D" text-anchor="middle" font-style="italic">jag är tråkig.'</text><rect x="222" y="18" width="196" height="130" rx="14" fill="#F6E6DF" stroke="#C57A5F" stroke-width="1.5"/><text x="320" y="54" font-size="16" font-weight="600" fill="#33312D" text-anchor="middle">Katastroftänkande</text><line x1="260" y1="68" x2="380" y2="68" stroke="#C57A5F" stroke-width="2" stroke-linecap="round"/><text x="320" y="96" font-size="13.5" font-weight="400" fill="#33312D" text-anchor="middle" font-style="italic">'Stammar jag blir</text><text x="320" y="116" font-size="13.5" font-weight="400" fill="#33312D" text-anchor="middle" font-style="italic">allt förstört.'</text><rect x="428" y="18" width="196" height="130" rx="14" fill="#FBEDE0" stroke="#E8B792" stroke-width="1.5"/><text x="526" y="54" font-size="16" font-weight="600" fill="#33312D" text-anchor="middle">Allt eller inget</text><line x1="466" y1="68" x2="586" y2="68" stroke="#E8B792" stroke-width="2" stroke-linecap="round"/><text x="526" y="96" font-size="13.5" font-weight="400" fill="#33312D" text-anchor="middle" font-style="italic">'Ett litet fel och</text><text x="526" y="116" font-size="13.5" font-weight="400" fill="#33312D" text-anchor="middle" font-style="italic">allt var misslyckat.'</text><rect x="16" y="168" width="196" height="130" rx="14" fill="#FBEDE0" stroke="#E8B792" stroke-width="1.5"/><text x="114" y="204" font-size="16" font-weight="600" fill="#33312D" text-anchor="middle">Mentalt filter</text><line x1="54" y1="218" x2="174" y2="218" stroke="#E8B792" stroke-width="2" stroke-linecap="round"/><text x="114" y="246" font-size="13.5" font-weight="400" fill="#33312D" text-anchor="middle" font-style="italic">Du märker det enda</text><text x="114" y="266" font-size="13.5" font-weight="400" fill="#33312D" text-anchor="middle" font-style="italic">som gick fel.</text><rect x="222" y="168" width="196" height="130" rx="14" fill="#E7EFE8" stroke="#7C9885" stroke-width="1.5"/><text x="320" y="204" font-size="16" font-weight="600" fill="#33312D" text-anchor="middle">Känslotänkande</text><line x1="260" y1="218" x2="380" y2="218" stroke="#7C9885" stroke-width="2" stroke-linecap="round"/><text x="320" y="246" font-size="13.5" font-weight="400" fill="#33312D" text-anchor="middle" font-style="italic">'Jag känner mig dum,</text><text x="320" y="266" font-size="13.5" font-weight="400" fill="#33312D" text-anchor="middle" font-style="italic">alltså är jag dum.'</text><rect x="428" y="168" width="196" height="130" rx="14" fill="#F6E6DF" stroke="#C57A5F" stroke-width="1.5"/><text x="526" y="204" font-size="16" font-weight="600" fill="#33312D" text-anchor="middle">Måste/borde</text><line x1="466" y1="218" x2="586" y2="218" stroke="#C57A5F" stroke-width="2" stroke-linecap="round"/><text x="526" y="246" font-size="13.5" font-weight="400" fill="#33312D" text-anchor="middle" font-style="italic">'Jag måste alltid ha</text><text x="526" y="266" font-size="13.5" font-weight="400" fill="#33312D" text-anchor="middle" font-style="italic">något smart att säga.'</text></svg>