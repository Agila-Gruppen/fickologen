<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t9 d9" font-family="'Source Sans 3', 'Source Sans', system-ui, -apple-system, 'Segoe UI', sans-serif"><title id="t9">Fokus inåt och utåt</title><desc id="d9">Tankar om sig själv drar uppmärksamheten inåt. Att rikta den utåt hjälper dig vara kvar i situationen.</desc><defs><marker id="mS9" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#4F6A5A"/></marker><marker id="mT9" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#C57A5F"/></marker><marker id="mM9" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#7A7468"/></marker></defs><rect x="1" y="1" width="638" height="318" rx="18" fill="#FFFFFF" stroke="#EAE3D7" stroke-width="2"/><rect x="16" y="16" width="296" height="288" rx="14" fill="#FFFFFF" stroke="#EAE3D7" stroke-width="1.5"/><rect x="328" y="16" width="296" height="288" rx="14" fill="#FFFFFF" stroke="#EAE3D7" stroke-width="1.5"/><text x="164" y="46" font-size="17" font-weight="600" fill="#A65F45" text-anchor="middle">Fokus inåt</text><circle cx="164" cy="140" r="24" fill="#F6E6DF" stroke="#C57A5F" stroke-width="2"/><path d="M122,218 Q122,174 164,174 Q206,174 206,218 Z" fill="#F6E6DF" stroke="#C57A5F" stroke-width="2"/><rect x="28" y="78" width="104" height="28" rx="14" fill="#FBEDE0" stroke="#E8B792" stroke-width="1.5"/><text x="80.0" y="97" font-size="13" font-weight="500" fill="#33312D" text-anchor="middle">Rodnar jag?</text><rect x="190" y="78" width="108" height="28" rx="14" fill="#FBEDE0" stroke="#E8B792" stroke-width="1.5"/><text x="244.0" y="97" font-size="13" font-weight="500" fill="#33312D" text-anchor="middle">Hur låter jag?</text><rect x="24" y="150" width="96" height="28" rx="14" fill="#FBEDE0" stroke="#E8B792" stroke-width="1.5"/><text x="72.0" y="169" font-size="13" font-weight="500" fill="#33312D" text-anchor="middle">Alla ser mig</text><rect x="208" y="150" width="92" height="28" rx="14" fill="#FBEDE0" stroke="#E8B792" stroke-width="1.5"/><text x="254.0" y="169" font-size="13" font-weight="500" fill="#33312D" text-anchor="middle">Tänk om…</text><line x1="84" y1="108" x2="142" y2="128" stroke="#C57A5F" stroke-width="2.5" stroke-linecap="round" marker-end="url(#mT9)"/><line x1="244" y1="108" x2="186" y2="128" stroke="#C57A5F" stroke-width="2.5" stroke-linecap="round" marker-end="url(#mT9)"/><line x1="120" y1="166" x2="134" y2="162" stroke="#C57A5F" stroke-width="2.5" stroke-linecap="round" marker-end="url(#mT9)"/><line x1="208" y1="166" x2="194" y2="162" stroke="#C57A5F" stroke-width="2.5" stroke-linecap="round" marker-end="url(#mT9)"/><text x="164" y="262" font-size="13.5" font-weight="400" fill="#7A7468" text-anchor="middle">Tankarna drar dig inåt,</text><text x="164" y="281" font-size="13.5" font-weight="400" fill="#7A7468" text-anchor="middle">och du missar vad som händer</text><text x="476" y="46" font-size="17" font-weight="600" fill="#4F6A5A" text-anchor="middle">Fokus utåt</text><circle cx="476" cy="140" r="24" fill="#E7EFE8" stroke="#7C9885" stroke-width="2"/><path d="M434,218 Q434,174 476,174 Q518,174 518,218 Z" fill="#E7EFE8" stroke="#7C9885" stroke-width="2"/><rect x="340" y="78" width="108" height="28" rx="14" fill="#E7EFE8" stroke="#7C9885" stroke-width="1.5"/><text x="394.0" y="97" font-size="13" font-weight="500" fill="#33312D" text-anchor="middle">Vad hen säger</text><rect x="512" y="78" width="100" height="28" rx="14" fill="#E7EFE8" stroke="#7C9885" stroke-width="1.5"/><text x="562.0" y="97" font-size="13" font-weight="500" fill="#33312D" text-anchor="middle">Rummet</text><rect x="340" y="150" width="94" height="28" rx="14" fill="#E7EFE8" stroke="#7C9885" stroke-width="1.5"/><text x="387.0" y="169" font-size="13" font-weight="500" fill="#33312D" text-anchor="middle">Rösten</text><rect x="518" y="150" width="94" height="28" rx="14" fill="#E7EFE8" stroke="#7C9885" stroke-width="1.5"/><text x="565.0" y="169" font-size="13" font-weight="500" fill="#33312D" text-anchor="middle">Det som sker</text><line x1="458" y1="124" x2="410" y2="108" stroke="#4F6A5A" stroke-width="2.5" stroke-linecap="round" marker-end="url(#mS9)"/><line x1="494" y1="124" x2="548" y2="108" stroke="#4F6A5A" stroke-width="2.5" stroke-linecap="round" marker-end="url(#mS9)"/><line x1="452" y1="162" x2="438" y2="164" stroke="#4F6A5A" stroke-width="2.5" stroke-linecap="round" marker-end="url(#mS9)"/><line x1="500" y1="162" x2="514" y2="164" stroke="#4F6A5A" stroke-width="2.5" stroke-linecap="round" marker-end="url(#mS9)"/><text x="476" y="262" font-size="13.5" font-weight="400" fill="#7A7468" text-anchor="middle">Du lyssnar och tittar utåt,</text><text x="476" y="281" font-size="13.5" font-weight="400" fill="#7A7468" text-anchor="middle">och du är kvar i situationen</text></svg>